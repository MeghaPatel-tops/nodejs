<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        function getData(cb){
            fetch('https://fakestoreapi.com/products')
                .then(response => response.json())
                .then(data => cb(data));
        }

        function printData(data){
                console.log(data);
                
        }

        getData(printData)
    </script>
</body>
</html>
